name: Dependency graph

# Sends the libraries the release builds really resolve to GitHub's dependency graph, so Dependabot alerts cover
# them. GitHub cannot read Gradle's version catalog by itself: without this, it only sees the CI actions.
#
# This job runs the Gradle build scripts with a token that can write the graph, so it runs only on main (and by
# hand), never on pull requests. Only this job gets that permission. Nothing here opens pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # Only what ships (two library AARs): the release runtime classpath of every module except :sample, the
      # sample app, which is only built in CI and never published. Modules are excluded by name, so a new
      # published module is covered without anyone having to remember it.
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph-include-configurations: '.*[Rr]eleaseRuntimeClasspath'
          dependency-graph-exclude-projects: ':sample'
