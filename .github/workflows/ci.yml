name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :billing:testDebugUnitTest :sample:testDebugUnitTest

      - name: Build the AAR and the Maven publication
        run: ./gradlew :billing:assembleRelease :billing:publishToMavenLocal

      - name: Build the sample app
        run: ./gradlew :sample:assembleDebug

      - name: Build the API docs
        run: ./gradlew :billing:dokkaGeneratePublicationHtml
