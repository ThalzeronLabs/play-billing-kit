name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (billing-compose runs its Compose UI tests on Robolectric)
        run: ./gradlew :billing:testDebugUnitTest :billing-compose:testDebugUnitTest :sample:testDebugUnitTest

      - name: Build the AARs and the Maven publications
        run: ./gradlew :billing:assembleRelease :billing-compose:assembleRelease :billing:publishToMavenLocal :billing-compose:publishToMavenLocal

      - name: Build the sample app
        run: ./gradlew :sample:assembleDebug

      - name: Build the API docs
        run: ./gradlew :dokkaGenerate
